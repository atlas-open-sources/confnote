name: OSS policy tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test .github/scripts/contribution-policy.test.cjs
      - run: python3 -m unittest discover -s tests -p test_oss_export.py
      - run: scripts/oss-export.sh --dry-run
