name: Contribution policy
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  contribution-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Read trusted default-branch policy only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test trusted policy
        run: node --test .github/scripts/contribution-policy.test.cjs
      - name: Label and draft; never close
        uses: actions/github-script@v7
        with:
          script: |
            const { run } = require('./.github/scripts/contribution-policy.cjs');
            await run({ github, context, core });
