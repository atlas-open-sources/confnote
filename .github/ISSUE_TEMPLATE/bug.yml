name: Report a bug
description: Report reproducible behavior without private vault content.
title: "[Bug] "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and synthetic reproduction
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and platform
    validations:
      required: true
  - type: markdown
    attributes:
      value: A bug report is not approval to implement a PR. Wait for an accepted issue. Never attach credentials or personal notes.
