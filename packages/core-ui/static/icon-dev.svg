<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="confnote dev">
  <!-- Identical layout to icon.svg — the ONLY difference is the "now" node
       color (amber #ff6a3d for dev vs green #4ad17e for prod). No bottom
       text label, so rows align byte-equivalent between prod and dev. -->
  <rect x="17" y="17" width="222" height="222" rx="32"
        fill="#0a0a0a" stroke="#ffffff" stroke-width="5"/>

  <rect x="53" y="64" width="2" height="128" fill="#2e2e2e"/>

  <g>
    <rect x="48" y="74"  width="12" height="12" rx="2" fill="#0a0a0a" stroke="#565660" stroke-width="2"/>
    <rect x="76" y="74"  width="32" height="12" rx="2" fill="#3a3a42"/>
    <rect x="120" y="74" width="72" height="12" rx="2" fill="#2e2e2e"/>

    <rect x="48" y="154" width="12" height="12" rx="2" fill="#0a0a0a" stroke="#565660" stroke-width="2"/>
    <rect x="76" y="154" width="32" height="12" rx="2" fill="#3a3a42"/>
    <rect x="120" y="154" width="58" height="12" rx="2" fill="#2e2e2e"/>

    <rect x="48" y="194" width="12" height="12" rx="2" fill="#0a0a0a" stroke="#565660" stroke-width="2"/>
    <rect x="76" y="194" width="32" height="12" rx="2" fill="#3a3a42"/>
    <rect x="120" y="194" width="68" height="12" rx="2" fill="#2e2e2e"/>
  </g>

  <!-- dev = amber "now" node — sole visual diff from prod -->
  <rect x="46" y="112" width="16" height="16" rx="2" fill="#ff6a3d"/>
  <rect x="76" y="114" width="32" height="12" rx="2" fill="#8f8f8f"/>
  <rect x="120" y="114" width="84" height="12" rx="2" fill="#ededf1"/>
</svg>
